<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFC Bank - Wallet & Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Modal background */
        .modal-bg { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-amber-400">🏦 HFC BANK</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-3 fade-in">
                <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-semibold">Customer</span>
                <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 text-xs px-3 py-1.5 rounded font-medium transition">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center">

        <!-- LOGIN / SIGNUP SECTION -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl fade-in">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white mb-1">Welcome to HFC</h2>
                <p class="text-sm text-slate-400">Create account to buy & manage coins</p>
            </div>
            
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 hover:bg-slate-200 transition shadow mb-6">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h5.51c-.24 1.25-1 2.31-2.12 3.03v2.51h3.42c2-1.84 3.36-4.56 3.36-7.86 0-.77-.07-1.5-.2-2.41z"/><path fill="currentColor" d="M12.18 21.3c2.97 0 5.46-.98 7.28-2.66l-3.42-2.51c-.98.66-2.23 1.06-3.86 1.06-2.96 0-5.47-2-6.37-4.7H2.2v2.59c1.83 3.64 5.56 6.22 9.98 6.22z"/><path fill="currentColor" d="M5.81 12.49c-.23-.69-.36-1.43-.36-2.49s.13-1.8.36-2.49V4.92H2.2C1.43 6.45 1 8.17 1 10s.43 3.55 1.2 5.08l3.61-2.59z"/><path fill="currentColor" d="M12.18 5.38c1.62 0 3.07.56 4.21 1.66l3.15-3.15C17.64 2.15 15.15 1 12.18 1 7.76 1 4.03 3.58 2.2 7.22l3.61 2.59c.9-2.7 3.41-4.43 6.37-4.43z"/></svg>
                <span>Signup / Login with Google</span>
            </button>

            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-slate-700"></div>
                <span class="flex-shrink-0 mx-4 text-slate-500 text-xs">OR EMAIL</span>
                <div class="flex-grow border-t border-slate-700"></div>
            </div>

            <div class="space-y-4">
                <input type="email" id="cust-email" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
                <input type="password" id="cust-password" placeholder="Password (Min 6 chars)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
                
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="loginEmail()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition">Login</button>
                    <button onclick="signupEmail()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3 rounded-xl transition">Sign Up</button>
                </div>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="customer-dashboard" class="hidden space-y-5 fade-in">
            <!-- Wallet Card -->
            <div class="relative overflow-hidden bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 p-8 rounded-3xl shadow-[0_10px_40px_rgba(245,158,11,0.2)] text-slate-950 text-center">
                <p class="text-xs font-black uppercase tracking-[0.2em] opacity-80 mb-2">Available Balance</p>
                <div class="flex justify-center items-center space-x-2">
                    <span id="customer-balance" class="text-7xl font-black drop-shadow-md">...</span>
                    <span class="text-4xl font-bold drop-shadow-md">🪙</span>
                </div>
                <p class="text-sm mt-4 font-semibold bg-black/10 inline-block px-4 py-1.5 rounded-full">Use coins to unlock premium content</p>
            </div>
            
            <!-- Open Store Button -->
            <button onclick="openStore()" class="w-full bg-slate-900 border border-amber-500/50 p-4 rounded-2xl text-amber-400 font-bold hover:bg-slate-800 transition shadow-[0_0_15px_rgba(245,158,11,0.2)] flex justify-center items-center space-x-2">
                <span class="text-xl">🛒</span><span>Buy More Coins</span>
            </button>
        </div>

    </main>

    <!-- COIN STORE MODAL -->
    <div id="store-modal" class="hidden fixed inset-0 modal-bg z-[100] flex items-center justify-center p-4 fade-in">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl relative">
            
            <button onclick="closeStore()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="p-6 text-center border-b border-slate-800">
                <h3 class="text-xl font-bold text-amber-400">Coin Store</h3>
                <p class="text-xs text-slate-400">Select a package to buy</p>
            </div>

            <div class="p-6 space-y-4">
                <!-- Package 1 -->
                <button onclick="processPayment(10, 50)" class="w-full flex justify-between items-center bg-slate-800 hover:bg-slate-700 border border-slate-600 p-4 rounded-xl transition group">
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl group-hover:scale-110 transition">🪙</span>
                        <div class="text-left">
                            <p class="font-bold text-white text-lg">10 Coins</p>
                            <p class="text-xs text-slate-400">Starter Pack</p>
                        </div>
                    </div>
                    <span class="bg-green-500/20 text-green-400 font-bold px-3 py-1.5 rounded-lg border border-green-500/30">₹50</span>
                </button>

                <!-- Package 2 -->
                <button onclick="processPayment(50, 200)" class="w-full flex justify-between items-center bg-slate-800 hover:bg-slate-700 border border-amber-500/50 p-4 rounded-xl transition group shadow-[0_0_10px_rgba(245,158,11,0.1)]">
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl group-hover:scale-110 transition">💎</span>
                        <div class="text-left">
                            <p class="font-bold text-amber-400 text-lg">50 Coins</p>
                            <p class="text-xs text-slate-400">Best Value</p>
                        </div>
                    </div>
                    <span class="bg-green-500 text-slate-900 font-bold px-3 py-1.5 rounded-lg border border-green-400">₹200</span>
                </button>
            </div>

            <!-- Fake Processing Screen -->
            <div id="processing-screen" class="hidden absolute inset-0 bg-slate-900 flex flex-col items-center justify-center p-6 text-center">
                <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <h4 class="font-bold text-lg mb-1 text-white">Processing UPI Payment...</h4>
                <p class="text-xs text-slate-400">Please do not close this window</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        // Import updateDoc and increment for real-time balance updates
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk",
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Authenticaton Functions
        window.loginWithGoogle = async () => { try { await signInWithPopup(auth, provider); } catch(e) { alert(e.message); } };
        window.loginEmail = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('cust-email').value, document.getElementById('cust-password').value); } catch(e) { alert("Invalid details"); } };
        window.signupEmail = async () => { try { await createUserWithEmailAndPassword(auth, document.getElementById('cust-email').value, document.getElementById('cust-password').value); } catch(e) { alert(e.message); } };
        window.logout = async () => { await signOut(auth); };

        // Real-time Database Listener
        let unsubscribe = null;

        onAuthStateChanged(auth, async (user) => {
            const loginSec = document.getElementById('login-section');
            const custDash = document.getElementById('customer-dashboard');
            const userInfo = document.getElementById('user-info');

            if (user) {
                const userRef = doc(db, "Users", user.uid);
                
                // Set up real-time listener so balance updates immediately on screen
                unsubscribe = onSnapshot(userRef, async (docSnap) => {
                    if (docSnap.exists()) {
                        if (docSnap.data().role === "admin") {
                            alert("Admins use admin portal.");
                            await signOut(auth); return;
                        }
                        // Update UI
                        loginSec.classList.add('hidden');
                        userInfo.classList.remove('hidden');
                        custDash.classList.remove('hidden');
                        document.getElementById('customer-balance').innerText = docSnap.data().wallet_balance || 0;
                    } else {
                        // Create New Account
                        await setDoc(userRef, { email: user.email, role: "customer", wallet_balance: 1, joined: new Date().toISOString() });
                    }
                });

            } else {
                // Cleanup on logout
                if (unsubscribe) unsubscribe();
                loginSec.classList.remove('hidden');
                custDash.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        // --- COIN BUYING LOGIC ---
        window.openStore = () => document.getElementById('store-modal').classList.remove('hidden');
        window.closeStore = () => document.getElementById('store-modal').classList.add('hidden');

        window.processPayment = async (coinsToBuy, priceInr) => {
            const user = auth.currentUser;
            if (!user) return alert("Please login first!");

            // 1. Show fake processing screen (Yahan future me Razorpay/PhonePe API aayegi)
            const processingScreen = document.getElementById('processing-screen');
            processingScreen.classList.remove('hidden');

            // 2. Simulate network delay (Wait 2 seconds)
            setTimeout(async () => {
                try {
                    // 3. ACTUAL DATABASE UPDATE: Add coins to user's wallet
                    const userRef = doc(db, "Users", user.uid);
                    await updateDoc(userRef, {
                        wallet_balance: increment(coinsToBuy) // Ye mathematically secure tarika hai add karne ka
                    });

                    // 4. Success UI Update
                    processingScreen.classList.add('hidden');
                    closeStore();
                    alert(`✅ Payment Successful! ${coinsToBuy} Coins added to your wallet.`);
                } catch (error) {
                    console.error(error);
                    processingScreen.classList.add('hidden');
                    alert("❌ Transaction failed. Please try again.");
                }
            }, 2000); // 2 second delay for realistic feel
        };
    </script>
</body>
</html>
