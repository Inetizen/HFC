    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ⚠️ DHAYAN DEIN: Yahan apna Asli Firebase Config lagana na bhoolein
        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk", 
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 🔒 SECURE STORE DATA: Hacker isko bahar se edit nahi kar sakta
        const storeProducts = [
            { id: "hotfake_1d", title: "Master Key (1 Day)", cost: 11, duration: "1D", icon: "🎟️" },
            { id: "hotfake_7d", title: "Master Key (1 Week)", cost: 49, duration: "7D", icon: "🔥" },
            { id: "hotfake_30d", title: "Master Key (1 Month)", cost: 99, duration: "30D", icon: "👑" }
        ];

        window.loginWithGoogle = async () => { 
            try { await signInWithPopup(auth, provider); } 
            catch(e) { alert("Login Error: " + e.message); } 
        };
        window.logout = async () => { await signOut(auth); };

        let unsubscribeUser = null;

        onAuthStateChanged(auth, async (user) => {
            const loginSec = document.getElementById('login-section');
            const dashSec = document.getElementById('customer-dashboard');
            const userInfo = document.getElementById('user-info');

            if (user) {
                // 🌟 FIX: User ki UID browser ke global object mein hamesha ke liye lock kar di
                window.sessionUid = user.uid; 
                
                loginSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                
                document.getElementById('user-name').innerText = user.displayName ? user.displayName.split(' ')[0] : "User";
                document.getElementById('user-avatar').src = user.photoURL || "https://ui-avatars.com/api/?name=User&background=random";

                const userRef = doc(db, "Users", user.uid);
                
                unsubscribeUser = onSnapshot(userRef, async (docSnap) => {
                    if (docSnap.exists()) {
                        document.getElementById('customer-balance').innerText = docSnap.data().wallet_balance || 0;
                    } else {
                        await setDoc(userRef, { 
                            name: user.displayName, 
                            email: user.email, 
                            role: "customer", 
                            wallet_balance: 0, 
                            joined: new Date().toISOString() 
                        });
                    }
                });

                renderStoreItems();
            } else {
                window.sessionUid = null;
                if (unsubscribeUser) unsubscribeUser();
                loginSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        function renderStoreItems() {
            const container = document.getElementById('store-items-container');
            container.innerHTML = ""; 
            storeProducts.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex justify-between items-center group hover:border-amber-500/50 transition">
                        <div class="flex items-center gap-3"><span class="text-2xl">${item.icon}</span><div><h4 class="font-bold text-white text-sm">${item.title}</h4><p class="text-xs text-slate-400">Cost: ${item.cost} 🪙</p></div></div>
                        <!-- 🛡️ HACK PREVENTED: Sirf ID bheja ja raha hai, Price aur Duration HTML se gayab kar diya -->
                        <button onclick="buyKey('${item.id}')" class="bg-slate-700 hover:bg-amber-500 hover:text-black text-white text-xs font-bold px-4 py-2 rounded-lg transition">Get Key</button>
                    </div>
                `;
            });
        }

        window.openAddCoins = () => {
            document.getElementById('add-coins-modal').classList.remove('hidden');
            document.getElementById('custom-coin-amount').value = ""; 
        };
        window.closeAddCoins = () => document.getElementById('add-coins-modal').classList.add('hidden');

        window.processCustomPayment = () => {
            const amount = parseInt(document.getElementById('custom-coin-amount').value);
            if (isNaN(amount) || amount < 11) {
                alert("⚠️ Minimum purchase is 11 Coins (₹11).");
                return;
            }
            window.startUPIPayment(amount); 
        };

        window.startUPIPayment = async (amountInr) => {
            const uid = window.sessionUid;
            if(!uid) return alert("Please login first to proceed.");

            var options = {
                "key": "rzp_test_YOUR_KEY_HERE", 
                "amount": amountInr * 100, 
                "currency": "INR",
                "name": "HFC Bank",
                "description": `Buying ${amountInr} 🪙 HFC Coins`,
                "theme": { "color": "#f59e0b" },
                "handler": async function (response) {
                    const paymentId = response.razorpay_payment_id;
                    try {
                        const userRef = doc(db, "Users", uid);
                        await runTransaction(db, async (transaction) => {
                            const sfDoc = await transaction.get(userRef);
                            if (!sfDoc.exists()) throw "User doc does not exist!";
                            let newBalance = (sfDoc.data().wallet_balance || 0) + amountInr;
                            transaction.update(userRef, { wallet_balance: newBalance });
                        });
                        closeAddCoins();
                        alert(`✅ Payment Successful!\n\n${amountInr} Coins added to your Wallet.\nTxn ID: ${paymentId}`);
                    } catch(e) {
                        alert("❌ Payment successful but failed to add coins. Contact Admin with Txn ID: " + paymentId);
                    }
                }
            };

            try {
                var rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response){ alert("❌ Payment Failed!\nReason: " + response.error.description); });
                rzp1.open();
            } catch(e) {
                const isConfirmed = confirm(`[TEST MODE] Razorpay key not setup.\n\nSimulate successful payment of ₹${amountInr}?`);
                if(isConfirmed) {
                     try {
                        const userRef = doc(db, "Users", uid);
                        await runTransaction(db, async (transaction) => {
                            const sfDoc = await transaction.get(userRef);
                            let newBalance = (sfDoc.data().wallet_balance || 0) + amountInr;
                            transaction.update(userRef, { wallet_balance: newBalance });
                        });
                        closeAddCoins();
                        alert(`✅ Demo Payment Successful! ${amountInr} Coins added.`);
                    } catch(err) { alert("Error: " + err); }
                }
            }
        };

        // 🛡️ HACK PREVENTED: Function sirf 'itemId' maang raha hai
        window.buyKey = async (itemId) => {
            const uid = window.sessionUid;
            if(!uid) return alert("Please login first to proceed.");

            // 🔒 Asli Price list se detail nikal rahe hain, hacker ki HTML detail ignore hogi
            const item = storeProducts.find(p => p.id === itemId);
            if (!item) return alert("❌ Error: Invalid Item ID detected!");

            const userRef = doc(db, "Users", uid);
            let purchaseSuccess = false;
            let generatedKey = "";

            try {
                await runTransaction(db, async (transaction) => {
                    const sfDoc = await transaction.get(userRef);
                    if (!sfDoc.exists()) throw "User not found";
                    
                    const currentBalance = sfDoc.data().wallet_balance || 0;
                    
                    // 🔒 Check with item.cost from our secure array
                    if (currentBalance < item.cost) throw "INSUFFICIENT_FUNDS";
                    
                    const newBalance = currentBalance - item.cost;
                    transaction.update(userRef, { wallet_balance: newBalance });
                    
                    // 🔒 Generate key with item.duration from our secure array
                    const randomString = Math.random().toString(36).substring(2, 8).toUpperCase();
                    generatedKey = `PASS-${item.duration}-${randomString}`;
                    purchaseSuccess = true;
                });

                if(purchaseSuccess) {
                    document.getElementById('generated-key-text').innerText = generatedKey;
                    document.getElementById('success-modal').classList.remove('hidden');
                }
            } catch (e) {
                if(e === "INSUFFICIENT_FUNDS") {
                    alert("❌ Not enough coins! Please add coins via UPI first.");
                    openAddCoins(); 
                } else {
                    alert("Error processing transaction: " + e);
                }
            }
        };

        window.closeSuccessModal = () => document.getElementById('success-modal').classList.add('hidden');
    </script>
