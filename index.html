<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFC Bank - Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions ke liye custom CSS */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-amber-400">🏦 HFC BANK</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-3 fade-in">
                <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-semibold tracking-wide">Customer</span>
                <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 border border-slate-700 hover:border-red-500 text-xs px-3 py-1.5 rounded font-medium transition duration-300">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center">

        <!-- LOGIN SECTION (Phone Only) -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl fade-in">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
                <p class="text-sm text-slate-400">Login with your phone number</p>
            </div>
            
            <!-- Step 1: Phone Input -->
            <div id="phone-input-group" class="space-y-4 fade-in">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mobile Number</label>
                    <input type="tel" id="phone-number" placeholder="+91 98765 43210" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-base focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                </div>
                <div id="recaptcha-container" class="flex justify-center mt-2"></div>
                <button id="send-otp-btn" onclick="sendOTP()" class="w-full bg-amber-500 text-slate-900 font-black text-lg py-3.5 px-4 rounded-xl hover:bg-amber-400 hover:shadow-[0_0_15px_rgba(245,158,11,0.4)] transition duration-300">
                    Get OTP
                </button>
            </div>

            <!-- Step 2: OTP Input -->
            <div id="otp-input-group" class="hidden space-y-4 fade-in">
                <p class="text-xs text-green-400 text-center font-medium bg-green-400/10 py-2 rounded-lg">✓ OTP sent successfully to your number</p>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Enter 6-digit OTP</label>
                    <input type="text" id="otp-code" placeholder="------" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-center tracking-[0.5em] text-xl font-bold focus:outline-none focus:border-green-500 transition">
                </div>
                <button onclick="verifyOTP()" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-black text-lg py-3.5 px-4 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                    Verify & Login
                </button>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="customer-dashboard" class="hidden space-y-5 fade-in">
            <!-- Wallet Card -->
            <div class="relative overflow-hidden bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 p-8 rounded-3xl shadow-[0_10px_40px_rgba(245,158,11,0.2)] text-slate-950 text-center border border-amber-300">
                <!-- Decorative background elements -->
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-20 blur-2xl"></div>
                
                <p class="text-xs font-black uppercase tracking-[0.2em] opacity-80 mb-2">Available Balance</p>
                <div class="flex justify-center items-center space-x-2">
                    <span id="customer-balance" class="text-7xl font-black tracking-tighter drop-shadow-md">0</span>
                    <span class="text-4xl font-bold drop-shadow-md">🪙</span>
                </div>
                <p class="text-sm mt-4 opacity-90 font-semibold bg-black/10 inline-block px-4 py-1.5 rounded-full">Use coins to unlock premium content</p>
            </div>
            
            <!-- Actions -->
            <button class="w-full bg-slate-900 border border-slate-700 hover:border-amber-500/50 p-4 rounded-2xl text-amber-400 font-bold hover:bg-slate-800 transition duration-300 flex justify-center items-center space-x-2 group">
                <span class="text-xl group-hover:scale-125 transition">➕</span>
                <span>Add More Coins via UPI</span>
            </button>
        </div>

    </main>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk",
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047",
            measurementId: "G-2LP6LXWLJF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. Initialize Recaptcha
        function initRecaptcha() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'normal',
                    'callback': (response) => {}
                });
            }
        }

        // 2. Send OTP
        window.sendOTP = async () => {
            const phoneNumber = document.getElementById('phone-number').value;
            if(!phoneNumber.startsWith('+') || phoneNumber.length < 11){
                alert("Please add country code (e.g., +919876543210)");
                return;
            }

            const btn = document.getElementById('send-otp-btn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            initRecaptcha();
            const appVerifier = window.recaptchaVerifier;

            try {
                const confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
                window.confirmationResult = confirmationResult;
                document.getElementById('phone-input-group').classList.add('hidden');
                document.getElementById('otp-input-group').classList.remove('hidden');
            } catch (error) {
                alert("Failed to send OTP. Please try again.");
                btn.innerText = "Get OTP";
                btn.disabled = false;
                if(window.recaptchaVerifier) {
                    window.recaptchaVerifier.clear();
                    window.recaptchaVerifier = null;
                }
            }
        };

        // 3. Verify OTP
        window.verifyOTP = async () => {
            const code = document.getElementById('otp-code').value;
            if(code.length !== 6) return alert("Enter 6-digit OTP");
            try {
                await window.confirmationResult.confirm(code);
            } catch (error) {
                alert("Invalid OTP! Try again.");
            }
        };

        // 4. Logout
        window.logout = async () => { 
            await signOut(auth); 
            document.getElementById('phone-input-group').classList.remove('hidden');
            document.getElementById('otp-input-group').classList.add('hidden');
            document.getElementById('phone-number').value = '';
            document.getElementById('otp-code').value = '';
            document.getElementById('send-otp-btn').innerText = "Get OTP";
            document.getElementById('send-otp-btn').disabled = false;
        };

        // 5. Auth State Logic (Customer Only)
        onAuthStateChanged(auth, async (user) => {
            const loginSec = document.getElementById('login-section');
            const custDash = document.getElementById('customer-dashboard');
            const userInfo = document.getElementById('user-info');

            if (user) {
                const userRef = doc(db, "Users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    // Agar galti se Admin yahan login kar le, toh usko batao
                    if (userData.role === "admin") {
                        alert("Admins should log in through the admin portal.");
                        await signOut(auth);
                        return;
                    }
                    
                    // Show Customer Dashboard
                    loginSec.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                    custDash.classList.remove('hidden');
                    document.getElementById('customer-balance').innerText = userData.wallet_balance || 0;
                } else {
                    // New Customer Account Creation
                    await setDoc(userRef, {
                        phone: user.phoneNumber,
                        role: "customer",
                        wallet_balance: 1, // 1 Coin Signup bonus
                        joined: new Date().toISOString()
                    });
                    
                    loginSec.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                    custDash.classList.remove('hidden');
                    document.getElementById('customer-balance').innerText = "1";
                }
            } else {
                loginSec.classList.remove('hidden');
                custDash.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
