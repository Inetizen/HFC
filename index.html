<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFC Bank - Test Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-amber-400">🏦 HFC BANK</span>
                <span class="text-xs bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full font-semibold">TEST MODE</span>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-3">
                <span id="user-phone" class="text-sm text-slate-300"></span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded font-medium transition">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main App -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center">

        <!-- Login Section -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl text-center">
            <h1 class="text-xl font-bold mb-2">Welcome to HFC Bank</h1>
            <p class="text-xs text-slate-400 mb-6">Test the system instantly as a guest.</p>
            
            <!-- GUEST LOGIN BUTTON -->
            <button onclick="loginAsGuest()" class="w-full bg-amber-500 text-slate-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 hover:bg-amber-400 transition shadow">
                <span class="text-xl">🕵️</span>
                <span>Enter as Guest (Test Access)</span>
            </button>
        </div>

        <!-- Wallet Dashboard -->
        <div id="dashboard-section" class="hidden space-y-4">
            <div class="bg-gradient-to-br from-amber-500 to-amber-700 p-6 rounded-2xl shadow-xl text-slate-950">
                <p class="text-xs font-bold uppercase tracking-wider opacity-80">HFC Wallet Balance</p>
                <div class="flex items-baseline space-x-2 mt-1">
                    <span id="wallet-balance" class="text-4xl font-black">...</span>
                    <span class="text-2xl font-bold">🪙 HF Coins</span>
                </div>
                <p class="text-xs mt-3 opacity-90" id="user-id-display">Account ID: Loading...</p>
            </div>
        </div>

    </main>

    <!-- FIREBASE LOGIC (The Bank Engine) -->
    <script type="module">
        // Firebase v10 SDK Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ⚠️ DHYAN DEIN: Yahan apne Firebase Project ki keys paste karni hain
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Guest Login Function
        window.loginAsGuest = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Guest login failed:", error);
                alert("Login fail hua. Kya aapne Firebase me 'Anonymous' chalu kiya hai?");
            }
        };

        // Logout Function
        window.logout = async () => {
            await signOut(auth);
        };

        // Bank System: User login hote hi Database check karna
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // UI update: Login hide, Dashboard show
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                
                document.getElementById('user-phone').innerText = "Guest User";
                document.getElementById('user-id-display').innerText = `Account ID: ${user.uid.substring(0, 8)}`;

                // Firestore Database Entry (The Ledger)
                const userRef = doc(db, "Users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // Agar user pehli baar aaya hai, toh naya khata kholo aur 1 coin do
                    await setDoc(userRef, {
                        phone: "Guest",
                        wallet_balance: 1,
                        joined_date: new Date().toISOString(),
                        status: "active_guest"
                    });
                    document.getElementById('wallet-balance').innerText = "1";
                    console.log("Naya Guest Khata Khul Gaya + 1 Coin Added!");
                } else {
                    // Agar purana guest hai, toh uska bacha hua balance dikhao
                    document.getElementById('wallet-balance').innerText = userSnap.data().wallet_balance;
                    console.log("Purana Guest Wapas Aaya.");
                }
            } else {
                // UI update: Logout hone par sab hide
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
