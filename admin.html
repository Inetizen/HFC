<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - HFC Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.fade-in { animation: fadeIn 0.3s ease-in-out; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }</style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-blue-900/50 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <span class="text-2xl font-black text-blue-500">🏦 HFC ADMIN</span>
            <div id="user-info" class="hidden flex items-center space-x-3 fade-in">
                <span class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full font-semibold shadow-[0_0_10px_rgba(37,99,235,0.5)]">Master Control Active</span>
                <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 text-xs px-3 py-1.5 rounded transition border border-slate-700 hover:border-red-500">Exit System</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 w-full flex-grow flex flex-col items-center mt-8">

        <!-- ADMIN LOGIN SECTION -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md fade-in">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white mb-1">Security Gateway</h2>
                <p class="text-sm text-blue-400">Restricted Access Only</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-blue-500 transition">
                <input type="password" id="admin-password" placeholder="Passcode" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-blue-500 transition">
                <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-[0_0_15px_rgba(37,99,235,0.4)] mt-4">
                    Authorize Access
                </button>
            </div>
        </div>

        <!-- ADMIN DASHBOARD SECTION -->
        <div id="admin-dashboard" class="hidden w-full space-y-6 fade-in">
            
            <!-- Top Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 text-slate-800 text-7xl opacity-50">👥</div>
                    <p class="text-sm text-slate-400 mb-1 relative z-10">Total Registered Users</p>
                    <p id="total-users-count" class="text-4xl font-black text-white relative z-10">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 text-slate-800 text-7xl opacity-50">🪙</div>
                    <p class="text-sm text-slate-400 mb-1 relative z-10">Total Coins in Circulation</p>
                    <p id="total-coins-count" class="text-4xl font-black text-amber-400 relative z-10">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <p class="text-sm text-slate-400 mb-1">Database Connection</p>
                    <div class="flex items-center space-x-2 mt-2">
                        <div class="w-4 h-4 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.8)]"></div>
                        <p class="text-xl font-bold text-green-400">Live & Secure</p>
                    </div>
                </div>
            </div>

            <!-- Users Data Table -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden mt-8">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-xl text-white">Customer Database</h3>
                    <button onclick="fetchUsersData()" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded transition border border-slate-700">
                        🔄 Refresh Data
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="px-6 py-4">Account ID</th>
                                <th class="px-6 py-4">Contact Info</th>
                                <th class="px-6 py-4">Role</th>
                                <th class="px-6 py-4 text-right">Wallet Bal (₹)</th>
                                <th class="px-6 py-4 text-right">HFC Coins</th>
                                <th class="px-6 py-4">Joined Date</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="divide-y divide-slate-800/50">
                            <!-- Data will be injected here via JavaScript -->
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-slate-500">Loading database records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Aapki Firebase Config Keys
        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk",
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- AUTHENTICATION ---
        window.loginAdmin = async () => {
            const e = document.getElementById('admin-email').value;
            const p = document.getElementById('admin-password').value;
            if(!e || !p) return alert("Please enter email and password.");
            try { 
                await signInWithEmailAndPassword(auth, e, p); 
            } catch (error) { 
                alert("❌ Authentication Failed. Check credentials."); 
            }
        };

        window.logout = async () => { await signOut(auth); };

        // --- ROUTING & SECURITY CHECK ---
        onAuthStateChanged(auth, async (user) => {
            const loginSec = document.getElementById('login-section');
            const adminDash = document.getElementById('admin-dashboard');
            const userInfo = document.getElementById('user-info');

            if (user) {
                const userRef = doc(db, "Users", user.uid);
                const userSnap = await getDoc(userRef);

                // 👑 STRICT ADMIN VERIFICATION
                if (userSnap.exists() && userSnap.data().role === "admin") {
                    loginSec.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                    adminDash.classList.remove('hidden');
                    
                    // Trigger Database Fetch
                    fetchUsersData();
                } else {
                    alert("⛔ SECURITY ALERT: You do not have Master Admin privileges.");
                    await signOut(auth);
                }
            } else {
                loginSec.classList.remove('hidden');
                adminDash.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        // --- DATABASE FETCHING LOGIC ---
        window.fetchUsersData = async () => {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-blue-400">Fetching records from secure server...</td></tr>';
            
            try {
                const usersCollection = collection(db, "Users");
                const snapshot = await getDocs(usersCollection);
                
                let html = '';
                let totalUsers = 0;
                let totalCoins = 0;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    totalUsers++;
                    totalCoins += (data.hfc_coins || 0);

                    // Formating Data
                    const contact = data.email || data.phone || "No Contact Info";
                    const roleBadge = data.role === 'admin' 
                        ? '<span class="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-xs font-bold border border-blue-500/30">Admin</span>'
                        : '<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-xs">Customer</span>';
                    
                    const dateObj = data.joined ? new Date(data.joined) : null;
                    const dateStr = dateObj ? dateObj.toLocaleDateString('en-IN') : "Unknown";

                    html += `
                        <tr class="hover:bg-slate-800/50 transition">
                            <td class="px-6 py-4 font-mono text-xs text-slate-500">${docSnap.id.substring(0, 8)}...</td>
                            <td class="px-6 py-4 font-medium text-white">${contact}</td>
                            <td class="px-6 py-4">${roleBadge}</td>
                            <td class="px-6 py-4 text-right font-bold text-green-400">${data.wallet_balance || 0}</td>
                            <td class="px-6 py-4 text-right font-bold text-amber-400">${data.hfc_coins || 0} 🪙</td>
                            <td class="px-6 py-4 text-slate-400 text-xs">${dateStr}</td>
                        </tr>
                    `;
                });

                if(snapshot.empty) {
                    html = '<tr><td colspan="6" class="px-6 py-4 text-center text-slate-500">No users found in database.</td></tr>';
                }

                tbody.innerHTML = html;
                document.getElementById('total-users-count').innerText = totalUsers;
                document.getElementById('total-coins-count').innerText = totalCoins;

            } catch (error) {
                console.error("Error fetching data:", error);
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Error connecting to database.</td></tr>';
            }
        };
    </script>
</body>
</html>
