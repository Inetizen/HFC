<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - HFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.fade-in { animation: fadeIn 0.3s ease-in-out; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }</style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-blue-900/50 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="text-2xl font-black text-blue-500">🏦 HFC ADMIN</span>
            <div id="user-info" class="hidden flex items-center space-x-3 fade-in">
                <span class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full font-semibold">Master Control</span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded transition">Exit</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 w-full flex-grow flex flex-col justify-center items-center">

        <!-- ADMIN LOGIN SECTION -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md fade-in">
            <h2 class="text-xl font-bold mb-6 text-center text-blue-400">Security Gateway</h2>
            <div class="space-y-4">
                <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:border-blue-500">
                <input type="password" id="admin-password" placeholder="Passcode" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:border-blue-500">
                <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition mt-2">Authorize Access</button>
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="admin-dashboard" class="hidden w-full space-y-6 fade-in mt-8">
            <h1 class="text-2xl font-bold border-b border-slate-800 pb-2">Overview</h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                    <p class="text-sm text-slate-400 mb-1">Total Users</p>
                    <p class="text-3xl font-bold text-white">Active</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                    <p class="text-sm text-slate-400 mb-1">System Status</p>
                    <div class="flex items-center space-x-2 mt-1">
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        <p class="text-xl font-bold text-green-400">Online & Secure</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk",
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.loginAdmin = async () => {
            const e = document.getElementById('admin-email').value;
            const p = document.getElementById('admin-password').value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch (error) { alert("Invalid Admin Credentials."); }
        };

        window.logout = async () => { await signOut(auth); };

        onAuthStateChanged(auth, async (user) => {
            const loginSec = document.getElementById('login-section');
            const adminDash = document.getElementById('admin-dashboard');
            const userInfo = document.getElementById('user-info');

            if (user) {
                const userRef = doc(db, "Users", user.uid);
                const userSnap = await getDoc(userRef);

                // STRICT ADMIN CHECK
                if (userSnap.exists() && userSnap.data().role === "admin") {
                    loginSec.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                    adminDash.classList.remove('hidden');
                } else {
                    alert("⛔ Unauthorized Access. You are not an Admin!");
                    await signOut(auth);
                }
            } else {
                loginSec.classList.remove('hidden');
                adminDash.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
