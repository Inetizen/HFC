<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFC Secure Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
        .loader { border: 4px solid #333; border-top: 4px solid #f59e0b; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center min-h-screen p-4">

    <!-- CHECKOUT BOX -->
    <div class="bg-slate-900 border border-amber-500/50 p-6 rounded-3xl shadow-[0_0_30px_rgba(245,158,11,0.2)] w-full max-w-sm text-center">
        <h2 class="text-xl font-black text-amber-500 mb-1">🏦 HFC Checkout</h2>
        <p class="text-xs text-slate-400 mb-6 border-b border-slate-700 pb-4">Secure Payment Gateway</p>
        
        <!-- Item Details -->
        <div class="bg-slate-800 p-4 rounded-xl mb-6 flex justify-between items-center border border-slate-700">
            <div class="text-left">
                <p class="text-xs text-slate-400">Paying for:</p>
                <p id="item-name" class="font-bold text-white text-sm">Verifying...</p>
            </div>
            <div class="text-right">
                <p class="text-2xl font-black text-amber-400" id="item-price">🔒</p>
            </div>
        </div>

        <!-- Dynamic Action Area -->
        <div id="action-area" class="min-h-[100px] flex flex-col items-center justify-center">
            <div class="loader"></div>
            <p class="text-xs text-slate-400 mt-3">Connecting to HFC Bank...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ⚠️ Apna Firebase Config dalein
        const firebaseConfig = {
            apiKey: "AIzaSyDuFOfwTplev2IfpCKfiH1ZxCSKuZaftUk", 
            authDomain: "hfc-bank-e2a34.firebaseapp.com",
            projectId: "hfc-bank-e2a34",
            storageBucket: "hfc-bank-e2a34.firebasestorage.app",
            messagingSenderId: "1029449998918",
            appId: "1:1029449998918:web:73babbd06999dbe2f16047"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const storeProducts = {
            "hotfake_1d": { title: "Master Key (1 Day)", cost: 11, duration: "1D" },
            "hotfake_7d": { title: "Master Key (1 Week)", cost: 49, duration: "7D" },
            "hotfake_30d": { title: "Master Key (1 Month)", cost: 99, duration: "30D" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('item');
        const item = storeProducts[itemId];

        let currentUser = null;
        let currentBalance = 0;

        // 🌟 STEP 1: SABSE PEHLE LOGIN CHECK KAREGA
        onAuthStateChanged(auth, async (user) => {
            const actionArea = document.getElementById('action-area');
            
            if (!user) {
                // USER LOGIN NAHI HAI
                currentUser = null;
                document.getElementById('item-name').innerText = "Please Login First";
                document.getElementById('item-price').innerText = "🔒";
                
                actionArea.innerHTML = `
                    <button id="login-btn" class="w-full bg-white text-slate-900 font-black py-4 rounded-xl flex justify-center gap-3 items-center hover:bg-slate-200 transition shadow-lg">
                        <svg class="w-6 h-6" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h5.51c-.24 1.25-1 2.31-2.12 3.03v2.51h3.42c2-1.84 3.36-4.56 3.36-7.86 0-.77-.07-1.5-.2-2.41z"/><path fill="currentColor" d="M12.18 21.3c2.97 0 5.46-.98 7.28-2.66l-3.42-2.51c-.98.66-2.23 1.06-3.86 1.06-2.96 0-5.47-2-6.37-4.7H2.2v2.59c1.83 3.64 5.56 6.22 9.98 6.22z"/><path fill="currentColor" d="M5.81 12.49c-.23-.69-.36-1.43-.36-2.49s.13-1.8.36-2.49V4.92H2.2C1.43 6.45 1 8.17 1 10s.43 3.55 1.2 5.08l3.61-2.59z"/><path fill="currentColor" d="M12.18 5.38c1.62 0 3.07.56 4.21 1.66l3.15-3.15C17.64 2.15 15.15 1 12.18 1 7.76 1 4.03 3.58 2.2 7.22l3.61 2.59c.9-2.7 3.41-4.43 6.37-4.43z"/></svg>
                        Login with Google
                    </button>`;
                document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
                return; 
            }

            // 🌟 STEP 2: LOGIN HONE KE BAAD ITEM CHECK KAREGA
            currentUser = user;
            
            if (!item) {
                // Agar URL galat hai ya directly khola gaya hai
                document.getElementById('item-name').innerText = "Unknown Product";
                document.getElementById('item-price').innerText = "0 🪙";
                actionArea.innerHTML = `
                    <p class="text-red-500 font-bold text-lg mb-1">❌ Invalid Checkout Link</p>
                    <p class="text-xs text-slate-400">Please start the payment from the Main Website.</p>
                `;
                return;
            }

            // 🌟 STEP 3: SAB KUCH SAHI HAI (Item aur Login dono)
            document.getElementById('item-name').innerText = item.title;
            document.getElementById('item-price').innerText = item.cost + " 🪙";
            actionArea.innerHTML = `<div class="loader"></div><p class="text-xs text-slate-400 mt-3">Fetching Wallet...</p>`;

            const userRef = doc(db, "Users", user.uid);
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentBalance = docSnap.data().wallet_balance || 0;
                    renderPaymentUI();
                } else {
                    setDoc(userRef, { name: user.displayName, email: user.email, wallet_balance: 0, role: "customer", joined: new Date().toISOString() });
                }
            });
        });

        function renderPaymentUI() {
            const actionArea = document.getElementById('action-area');
            const shortfall = item.cost - currentBalance;

            if (currentBalance >= item.cost) {
                actionArea.innerHTML = `
                    <p class="text-sm text-slate-300 mb-3">Wallet Balance: <span class="font-bold text-green-400">${currentBalance} 🪙</span></p>
                    <button id="pay-hfc-btn" class="w-full bg-amber-500 text-black font-black py-4 rounded-xl shadow-lg hover:bg-amber-400 transition">Pay ${item.cost} 🪙 Securely</button>
                `;
                document.getElementById('pay-hfc-btn').onclick = processHFCPayment;
            } else {
                actionArea.innerHTML = `
                    <p class="text-sm text-slate-300 mb-1">Wallet Balance: <span class="font-bold text-red-400">${currentBalance} 🪙</span></p>
                    <p class="text-xs text-amber-500 mb-3">You need ${shortfall} more coins.</p>
                    <button id="recharge-btn" class="w-full bg-slate-800 text-white border border-slate-600 font-bold py-3 rounded-xl hover:bg-slate-700 transition shadow-[0_0_10px_rgba(255,255,255,0.05)]">Recharge ${shortfall} Coins (₹${shortfall})</button>
                `;
                document.getElementById('recharge-btn').onclick = () => processUPI(shortfall);
            }
        }

        async function processUPI(amount) {
            document.getElementById('action-area').innerHTML = `<div class="loader"></div><p class="text-xs mt-2">Waiting for UPI...</p>`;
            
            // ⚠️ RAZORPAY CODE HERE
            var options = {
                "key": "rzp_test_YOUR_KEY_HERE",
                "amount": amount * 100, 
                "currency": "INR",
                "name": "HFC Bank Recharge",
                "handler": async function (response) {
                    try {
                        await runTransaction(db, async (t) => {
                            const ref = doc(db, "Users", currentUser.uid);
                            const docSnap = await t.get(ref);
                            t.update(ref, { wallet_balance: (docSnap.data().wallet_balance || 0) + amount });
                        });
                    } catch(e) { alert("Recharge DB error."); }
                }
            };
            
            try { 
                var rzp1 = new Razorpay(options); 
                rzp1.on('payment.failed', () => renderPaymentUI());
                rzp1.open(); 
            } catch(e) {
                if(confirm(`[TEST] Simulate paying ₹${amount}?`)) {
                    await runTransaction(db, async (t) => {
                        const ref = doc(db, "Users", currentUser.uid);
                        const docSnap = await t.get(ref);
                        t.update(ref, { wallet_balance: (docSnap.data().wallet_balance || 0) + amount });
                    });
                } else { renderPaymentUI(); }
            }
        }

        async function processHFCPayment() {
            document.getElementById('action-area').innerHTML = `<div class="loader"></div><p class="text-xs mt-2 text-green-400">Processing...</p>`;
            try {
                let generatedKey = "";
                await runTransaction(db, async (t) => {
                    const userRef = doc(db, "Users", currentUser.uid);
                    const userDoc = await t.get(userRef);
                    if (userDoc.data().wallet_balance < item.cost) throw "FUNDS";
                    
                    t.update(userRef, { wallet_balance: userDoc.data().wallet_balance - item.cost });
                    
                    const randomString = Math.random().toString(36).substring(2, 8).toUpperCase();
                    generatedKey = `PASS-${item.duration}-${randomString}`;
                    
                    const keyRef = doc(db, "Active_Keys", generatedKey);
                    t.set(keyRef, { duration: item.duration, status: "active", createdBy: currentUser.uid, createdAt: new Date().toISOString() });
                });

                document.getElementById('action-area').innerHTML = `<p class="text-4xl mb-2">✅</p><p class="text-sm font-bold text-green-400">Success! Unlocking...</p>`;
                
                setTimeout(() => {
                    window.opener.postMessage({ status: "success", key: generatedKey }, "*");
                    window.close(); 
                }, 1500);

            } catch(e) { alert("Transaction Failed!"); renderPaymentUI(); }
        }
    </script>
</body>
</html>
